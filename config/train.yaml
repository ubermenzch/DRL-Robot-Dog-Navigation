# ==================== 启动参数 ====================
gpu_id: 2  # 使用的GPU编号（可用于导出 CUDA_VISIBLE_DEVICES）
num_envs: 8  # 并行环境数量(一个环境要占用800m左右的显存)
multi_env_log_model_dir: "log/multi_env_training"  # 日志和模型保存基目录，启动训练时会在此下按时间戳创建子目录存放日志与模型
gazebo_wait_time: 10 # Gazebo启动等待时间（秒），建议设置为30-60秒以确保所有环境完全启动；对于32个环境，建议至少30秒
gazebo_start_interval: 5  # 每个Gazebo环境启动后的间隔时间（秒），建议设置为3-5秒以避免资源竞争；对于32个环境，建议至少3秒
gazebo_base_port: 10001  # Gazebo Master端口基址，每个环境使用 gazebo_base_port + env_id 作为端口（例如：gazebo_base_port=11345, env_id=0 则使用端口11345）；不同容器应设置不同的基址以避免端口冲突
start_ros_domain_id: 1  # 起始ROS_DOMAIN_ID，多环境从此ID开始递增（例如：start_ros_domain_id=1, num_envs=4，则使用ROS_DOMAIN_ID 1,2,3,4）；重要：多个Docker容器同时运行时，每个容器必须使用不同的起始值以避免DDS类型冲突（例如：容器1用1，容器2用100）
enable_weight_consistency_check: false  # 是否进行模型权重一致性详细检验（为true时会在每个环境初始化时打印大量权重信息）

# ==================== 模型参数 ====================
hidden_layers: [1024,1024,1024,1024,1024]  # 神经网络隐藏层结构
action_dim: 2  # 模型产生的动作数量
max_action: 1  # 输出动作的最大绝对值
# base_state_dim 不再手动配置：由代码按 base_state_dim = bin_num + 7 动态计算
# base_state_dim: 79
bin_num: 72  # 将laser_scan按角度分区的数量（bin），用于对scan进行分桶/聚合；需与代码中读取该参数的逻辑一致
state_history_steps: 20  # 包含历史多少step的state信息（例如：2表示包含当前step和之前2个step，共3个step的状态信息）；当state_history_steps > 0时启用历史state，state_dim = base_state_dim * (1 + state_history_steps)；当为0时不启用历史state，state_dim = base_state_dim
load_model: false  # 是否加载已有模型
load_path: "log/baseline/sc97.5/train_20260127_204223/best_model"  # 模型加载路径

# ==================== 训练参数 ====================
discount_factor: 0.99  # 折扣因子（gamma），用于计算未来奖励的折扣，范围通常在0.9-0.999之间
actor_update_frequency: 1  # Actor网络更新频率（每多少次critic更新后更新一次actor）
critic_target_update_frequency: 1  # Critic目标网络更新频率（每多少次critic更新后更新一次目标网络）
actor_grad_clip_value: 2.0  # Actor网络梯度裁剪值（>0时启用梯度裁剪，将梯度裁剪到[-actor_grad_clip_value, actor_grad_clip_value]范围；0或负数表示不进行梯度裁剪）
critic_grad_clip_value: 20.0  # Critic网络梯度裁剪值（>0时启用梯度裁剪，将梯度裁剪到[-critic_grad_clip_value, critic_grad_clip_value]范围；0或负数表示不进行梯度裁剪）
actor_lr: 0.0001  # Actor网络学习率，用于控制策略网络（Actor）的更新步长
critic_lr: 0.0001  # Critic网络学习率，用于控制价值网络（Critic）的更新步长
alpha_lr: 0.0001  # 温度参数α的学习率（entropy temperature），用于自动调节探索程度
batch_size: 32  # 从经验池中随机抽取batch_size条经验作为一个训练批次来对模型参数进行更新
min_batches_for_training: 0  # 训练开始前需要收集的最少batch数量（0表示只要有数据就训练；1表示需要至少1个batch的数据，即batch_size个样本；5表示需要至少5个batch的数据，即5*batch_size个样本）
train_n_per_step: 1.0  # 每个收集到的step对应的训练轮次倍率；实际本轮训练次数=本轮收集到的总step数 * train_n_per_step
buffer_size: 10000  # 重放缓冲区大小
recent_buffer_ratio: 0.0  # 若recent_buffer_ratio=0.1，则表示重放缓存区的最新10%为新数据。
recent_batch_ratio: 0.0  # 若recent_batch_ratio=0.3，则表示batch中30%的样本来自新数据。

# ==================== 分层经验池采样（Goal/Collision/Timeout） ====================
enable_stratified_replay: false  # 是否启用分层经验池采样；false时使用单一replay_buffer
# 单环境训练（`src/drl_navigation_ros2/train.py`）默认强制使用单一经验池（不分层）。
# 如确需在单环境启用分层经验池，请设置为 true（一般不建议）。
single_env_enable_stratified_replay: false
stratified_replay:
  min_steps_to_enable: 300  # 只有当 goal/collision/timeout 三个buffer的step数都>=该阈值时，才启用动态比例采样；否则按三者当前大小比例采样
  stats_window_size: 1000  # 分层经验池采样统计滑动窗口大小（计算成功/碰撞率时使用的滑动窗口步数）
  goal:
    boost: 0.10      # goal采样比例 = 当前成功率 + boost
    max_prop: 0.40   # goal采样比例上限
  collision:
    boost: 0.10      # collision采样比例 = 当前碰撞率 + boost
    max_prop: 0.40   # collision采样比例上限
  min_timeout_prop: 0.10  # timeout在batch中的最小占比（必要时会缩放goal/collision）
save_every: 10  # 每多少次训练后保存一次模型
max_rounds: 0  # 最大收集-训练轮次数（每轮=收集一批+训练一次，达到后停止）；如需无限训练可设为0或负数
eval_start_after_all_target_dist_max: true
eval_every_rounds: 200
eval_episodes_per_round: 200

# ==================== 仿真环境数据收集参数 ====================
turtlebot3_model: "world_20by20_v1" #"base_world_100by100"  # TurtleBot3模型名称，用于指定Gazebo世界文件（例如：base_world_100by100、base_world_50by50、waffle等）
max_steps: 300  # 限制每个回合最多执行max_steps步操作，超过会强制结束回合（当max_steps_ratio=0时使用此固定值）
max_steps_ratio: 0  # 每Episode最大步数比例 (max_steps = target_distance * max_steps_ratio)，当为0时使用固定值max_steps
max_steps_min: 50  # 每Episode最小步数 (max_steps不会小于此值)
max_target_dist: 10.0  # 最大目标距离
init_target_distance: 2.0  # 初始目标距离
target_dist_increase: 0.01  # 目标距离增加量
target_reached_delta: 1.0  # 判定到达目标的阈值
collision_delta: 0.5  # 碰撞检测阈值
world_size: 20  # 世界尺寸（米）
goals_per_map: 4  # 每张地图的目标点数量（即一张地图可以用来产生多少个episode）；当机器人完成一个episode后，如果不达到此数量，则不重新生成地图（障碍物），只将机器人重置到最近的空格子中心并重新生成目标点；达到此数量后才重新生成新地图
obs_num: 30  # 障碍物数量
obs_distribution_mode: "random"  # 障碍物生成方式："uniform"=均匀分布（默认），"random"=随机分布
#costmap中地图左下角的那一格的坐标为(0,0)，右上角那一格的坐标为(world_size/costmap_resolution-1,world_size/costmap_resolution-1)
#世界坐标系中，地图左下角的坐标为(-world_size/2,-world_size/2)，右上角那一格的坐标为(world_size/2,world_size/2)
costmap_resolution: 2.0  # costmap 分辨率（米/格）
obstacle_size: 1.0 #8.0  # costmap 中障碍物等效边长（米，默认正方形）
obs_min_dist: 1.0 #8.0  # 障碍物中心最小距离（米）
region_select_bias: 1.0  # 选择"最大连通区域"的概率：1.0=总是选择最大区域；0.8=80%概率选最大，否则从剩余区域随机选0.6
collection_wait_ratio: 0.6  # 达到该比例的收集进程完成当前episode后触发停止信号（其余进程会中断当前episode并提交已收集的step）
min_collection_ratio: 0.25  # 每个环境本轮至少要收集的最小episode进度比例（例如0.25表示至少收集25%的步数后才允许被停止进入训练）

# ==================== 机器人参数 ====================
max_velocity: 2.5  # 最大速度
max_acceleration: 4.0  # 最大加速度（m/s^2）
max_deceleration: -4.0  # 最大减速度（m/s^2，建议填负值表示减速幅度，代码会取绝对值）
max_yawrate: 30  # 最大偏航率（单位：度/秒）
neglect_angle: 0  # 前方视野左右两边忽略的角度（单位：度）(90度则由全向变为前向)
scan_range: 10  # 激光雷达扫描范围
localization_noise_stddev: 0.304  # 0.304约等于90%的取值的绝对值分布在0.5内；对odom的x,y添加 N(0, stddev) 高斯噪声；0表示不加噪声
sensor_freq_limit:
  scan_max_freq: 15.0   # 激光雷达最大处理频率（Hz），0表示不限制；建议值：5-20
  odom_max_freq: 30.0   # 里程计最大处理频率（Hz），0表示不限制；建议值：20-50
  imu_max_freq: 30.0   # IMU最大处理频率（Hz），0表示不限制；建议值：50-200

# ==================== 传感器日志开关 ====================
# 控制是否记录各传感器的详细日志（只有实际更新数据时才记录，被频率限制跳过的callback不记录）
sensor_log_enable:
  scan_enable_log: false  # 是否记录激光雷达日志（true=记录，false=不记录）
  odom_enable_log: true  # 是否记录里程计日志（true=记录，false=不记录）
  imu_enable_log: true  # 是否记录IMU日志（true=记录，false=不记录）

# ==================== 奖励函数参数 ====================
reward_scale: 0.05  # 奖励缩放因子，用于控制每步整体奖励大小；1.0表示不缩放；统一应用于所有奖励（goal_reward、collision_penalty、各惩罚项）
collision_penalty_base: -150.0  # 碰撞惩罚系数（负值惩罚）
goal_reward: 100.0  # 到达目标的奖励

# ==================== 进度奖惩参数 ====================
enable_progress_reward: false  # 是否启用进度奖惩（靠近目标奖励，远离惩罚）
progress_reward_base: 0.5  # 进度奖惩系数；奖励 = base * [(上次距终点-当前距终点)/(step_sleep_time*max_velocity)]

# ==================== 终点距离惩罚参数 ====================
enable_target_distance_penalty: true  # 是否启用终点距离惩罚
target_distance_penalty_base: -0.5  # 终点距离惩罚基础系数（负值表示惩罚）；惩罚 = base * (当前距离 / 初始距离)

# ==================== 时间步惩罚参数 ====================
enable_step_penalty: true  # 是否启用每个时间步的固定惩罚
step_penalty_base: -0.5  # 每个step的常数惩罚（未缩放前的值，负值表示惩罚）

# ==================== 线速度惩罚参数 ====================
enable_linear_penalty: false  # 是否启用线速度惩罚
linear_penalty_base: -0.3  # 线速度基础惩罚

# ==================== 角度偏移惩罚参数 ====================
enable_angle_penalty: false  # 是否启用角度偏移惩罚
angle_penalty_base: -0.3  # 角度偏差基础惩罚

# ==================== 角速度惩罚参数 ====================
enable_yawrate_penalty: false  # 是否启用角速度惩罚
yawrate_penalty_base: -0.5  # 角速度惩罚系数（负值惩罚，0为无惩罚）

# ==================== 障碍物距离惩罚参数 ====================
enable_obs_penalty: false  # 是否启用障碍物距离惩罚
obs_penalty_threshold: -1.0  # 障碍物距离惩罚阈值（米）；设为-1时按 |线速度| * sim_time 自动计算阈值；否则使用固定阈值
min_obs_penalty_threshold: 0.5  # 动态计算阈值时的最小阈值下限，避免阈值过小
obs_penalty_base: -0.5  # 障碍物距离惩罚基础系数，负值表示惩罚
obs_penalty_power: 2.0  # 障碍物距离惩罚指数，值越大惩罚增长越快（建议范围：1.0-3.0）
obs_penalty_high_weight: 1.0  # 中间高权重区域惩罚权重
obs_penalty_low_weight: 0.4  # 两侧低权重区域惩罚权重
obs_penalty_middle_ratio: 0.4  # 中间高权重区域比例（0-1）
sim_time: 2.0  # 仿真步长，用于速度相关的动态阈值等计算

# ==================== 线速度加速度震荡惩罚参数 ====================
enable_linear_acceleration_oscillation_penalty: false  # 是否启用线速度加速度震荡惩罚
linear_acceleration_oscillation_penalty_base: -1.0  # 线速度加速度震荡惩罚基础系数（负值表示惩罚）；当加速度符号改变时，惩罚 = base * |当前加速度 - 上一加速度|

# ==================== 角速度震荡惩罚参数 ====================
enable_yawrate_oscillation_penalty: false  # 是否启用角速度震荡惩罚
yawrate_oscillation_penalty_base: -1.0  # 角速度震荡惩罚基础系数（负值表示惩罚）；当角速度符号改变时，惩罚 = base * |当前角速度 - 上一角速度|

# ==================== 单环境参数 ====================
run_mode: 2  # 运行模式：1=后台模式（不向终端输出，终端关闭训练不停止）；2=可视化模式（VNC/本机显示）
single_env_ros_domain_id: 0  # ROS_DOMAIN_ID，用于隔离不同的ROS2网络域，默认为0
pretrain: false  # 是否执行预训练（为true时会加载预存经验池并进行预训练；为false时不加载预存经验池）
pretraining_iterations: 50  # 预训练迭代次数
enable_action_noise: true  # 是否开启动作噪声（为true时在get_action中添加噪声；为false时get_action不添加噪声），目前仅对单环境训练生效
pretrain_data_path: "src/drl_navigation_ros2/assets/data.yml"  # 预训练数据路径
single_env_log_dir: "log/single_env_training"  # 日志保存基目录，启动训练时会在此下按时间戳创建子目录存放日志
n_step_per_train: 0  # 收集多少step后执行一次梯度更新（仅单环境训练使用；0=不训练仅可视化；1=每个step都更新）
buffer_train_start_size: 300
max_episodes: 0  # 最大episode数（单环境训练使用；达到此数量后停止训练；0或负数表示无限训练）
save_every_single_env: 300  # 单环境训练：每多少次训练后保存一次模型（如果未设置，则使用save_every的值）
gazebo_port: 19999  # 单环境训练：Gazebo Master端口地址（默认11345，避免与多环境训练端口冲突）
# ==================== 不太重要的参数 ====================
step_sleep_time: 0.2  # step方法中的sleep时间（秒）
reset_step_count: 25  # reset方法中调用step的次数